name: Go validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/...
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: bash
        run: |
          mkdir -p bin
          suffix=""
          if [ "${{ matrix.goos }}" = windows ]; then suffix=.exe; fi
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -o "bin/zotero-go-cli-${{ matrix.goos }}-${{ matrix.goarch }}$suffix" ./cmd/zotero-go-cli
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-go-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
